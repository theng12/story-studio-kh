<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Rounded square background with dark gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d27"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c674"/>
      <stop offset="100%" stop-color="#c99b4a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <circle cx="512" cy="400" r="380" fill="url(#gold)" opacity="0.05"/>

  <!-- Crescent moon -->
  <g transform="translate(512, 420)" filter="url(#glow)">
    <circle cx="0" cy="0" r="200" fill="url(#gold)" opacity="0.95"/>
    <circle cx="60" cy="-30" r="180" fill="#0f1117"/>
  </g>

  <!-- Stars -->
  <circle cx="300" cy="250" r="4" fill="url(#gold)" opacity="0.8"/>
  <circle cx="740" cy="200" r="5" fill="url(#gold)" opacity="0.7"/>
  <circle cx="200" cy="380" r="3" fill="url(#gold)" opacity="0.6"/>
  <circle cx="820" cy="360" r="4" fill="url(#gold)" opacity="0.8"/>

  <!-- "KH" text at the bottom -->
  <text x="512" y="830"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="180"
        font-weight="700"
        fill="url(#gold)"
        text-anchor="middle"
        letter-spacing="12">KH</text>

  <!-- Accent line under KH -->
  <rect x="412" y="860" width="200" height="4" rx="2" fill="url(#gold)" opacity="0.6"/>
</svg>
